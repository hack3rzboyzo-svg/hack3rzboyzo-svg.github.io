    // Sorting & rendering
    let currentSort = { col: 0, asc: true };
    function render() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const chap = document.getElementById("chapterFilter").value;
        let filtered = fullData.filter(item => (chap === "all" || item.ch == chap) &&
            (item.q.toLowerCase().includes(search) || item.ex.toLowerCase().includes(search) || item.a.toLowerCase().includes(search)));
        filtered.sort((a,b) => {
            let av, bv;
            if (currentSort.col === 0) { av = a.ch; bv = b.ch; }
            else if (currentSort.col === 1) { av = a.ex; bv = b.ex; }
            else if (currentSort.col === 2) { av = a.q; bv = b.q; }
            else { av = a.a; bv = b.a; }
            return (av < bv) === currentSort.asc ? -1 : 1;
        });
        document.getElementById("stats").innerHTML = `📋 Showing ${filtered.length} of ${fullData.length} questions (every exercise part).`;
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = filtered.map(i => `<tr><td><span class="chapter-badge">${i.ch}</span></td><td>${i.ex}</td><td>${i.q}</td><td class="answer">${i.a}</td></tr>`).join("");
    }
    function sortTable(col) { if (currentSort.col === col) currentSort.asc = !currentSort.asc; else { currentSort.col = col; currentSort.asc = true; } render(); }
    document.querySelectorAll("th").forEach((th,idx) => th.addEventListener("click", () => sortTable(idx)));
    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("chapterFilter").addEventListener("change", render);
    render();

    const toggle = document.getElementById("darkModeToggle");
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.body.classList.add("dark");
    toggle.addEventListener("click", () => { document.body.classList.toggle("dark"); toggle.innerHTML = document.body.classList.contains("dark") ? "☀️ Light Mode" : "🌙 Dark Mode"; });
</script>
