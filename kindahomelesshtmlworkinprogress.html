    <script>
        // Adds a caption under every .sound using its data-label.
        // Double-click a caption to rename it live.
        document.querySelectorAll('.sound').forEach(function (box) {
            var label = document.createElement('span');
            label.className = 'label';
            label.textContent = box.dataset.label || '';
            label.title = 'Double-click to rename';
            label.addEventListener('dblclick', function () {
                var newName = prompt('New name:', label.textContent);
                if (newName !== null) {
                    label.textContent = newName;
                    box.dataset.label = newName;
                }
            });
            box.appendChild(label);
        });
