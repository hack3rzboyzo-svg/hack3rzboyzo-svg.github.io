<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --space-1:#070a1f;
  --space-2:#10163a;
  --space-3:#241a4d;
  --moon:#eef1ff;
  --moon-glow:#9db4ff;
  --ember:#ff8fd8;
  --ok:#7dffcf;
  --bad:#ff6b8b;
  --glass:rgba(18,24,60,.55);
  --line:rgba(157,180,255,.28);
}

*{box-sizing:border-box}

html,body{height:100%}

body{
  margin:0;
  font-family:'Outfit',system-ui,sans-serif;
  color:var(--moon);
  background:
    radial-gradient(1200px 700px at 50% -10%, var(--space-3) 0%, transparent 60%),
    radial-gradient(900px 600px at 90% 110%, #2b1247 0%, transparent 55%),
    linear-gradient(180deg, var(--space-2), var(--space-1));
  overflow:hidden;
}

#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* ---------- moon ---------- */
.moon{
  position:fixed;
  top:-140px;right:-120px;
  width:420px;height:420px;border-radius:50%;
  z-index:1;
  background:
    radial-gradient(circle at 32% 30%, #ffffff 0%, #e6eaff 35%, #b8c3f2 70%, #8e9ad6 100%);
  box-shadow:
    0 0 60px 10px rgba(157,180,255,.45),
    0 0 180px 60px rgba(157,180,255,.25),
    inset -40px -30px 80px rgba(60,70,140,.45);
  animation:float 9s ease-in-out infinite;
}
.moon::before,.moon::after{
  content:"";position:absolute;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, rgba(90,100,170,.35), rgba(90,100,170,.1) 70%);
}
.moon::before{width:90px;height:90px;left:80px;top:150px}
.moon::after{width:55px;height:55px;left:200px;top:230px}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(18px)}
}

/* ---------- layout ---------- */
.stage{
  position:relative;z-index:2;
  height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}

.card{
  width:min(440px,100%);
  padding:40px 34px 32px;
  border-radius:26px;
  background:var(--glass);
  border:1px solid var(--line);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.03) inset,
    0 30px 80px rgba(0,0,0,.55),
    0 0 90px rgba(157,180,255,.18);
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes rise{
  from{opacity:0;transform:translateY(28px) scale(.97)}
  to{opacity:1;transform:none}
}

.lock{
  width:64px;height:64px;margin:0 auto 18px;
  display:grid;place-items:center;
  font-size:30px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.25), rgba(157,180,255,.08));
  border:1px solid var(--line);
  box-shadow:0 0 30px rgba(157,180,255,.45);
  transition:.5s;
}

h1{
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:2rem;
  line-height:1.1;
  text-align:center;
  margin:0 0 6px;
  letter-spacing:-.01em;
  text-shadow:0 0 28px rgba(157,180,255,.7);
}

.sub{
  text-align:center;
  margin:0 0 26px;
  font-weight:300;
  color:#b9c3ee;
}

/* ---------- input ---------- */
.field{position:relative}

input[type=password],input[type=text]{
  width:100%;
  padding:15px 18px;
  font:inherit;font-size:1.05rem;
  color:var(--moon);
  background:rgba(7,10,31,.6);
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;
  transition:border-color .25s, box-shadow .25s;
}
input::placeholder{color:#7f8bbd}
input:focus{
  border-color:var(--moon-glow);
  box-shadow:0 0 0 4px rgba(157,180,255,.18), 0 0 30px rgba(157,180,255,.35);
}

.unlock{
  width:100%;
  margin-top:14px;
  padding:15px;
  font:inherit;font-weight:600;font-size:1.05rem;
  color:#0a0f2c;
  background:linear-gradient(135deg,var(--moon-glow),var(--ember));
  border:0;border-radius:14px;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(157,180,255,.45);
  transition:transform .15s, box-shadow .25s, filter .25s;
}
.unlock:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,143,216,.5);filter:brightness(1.06)}
.unlock:active{transform:translateY(0)}
.unlock:focus-visible,.hint-btn:focus-visible,a.enter:focus-visible{outline:3px solid var(--moon);outline-offset:3px}

#error{
  min-height:1.4em;
  margin:14px 0 0;
  text-align:center;
  color:var(--bad);
  font-weight:600;
}

/* ---------- hint ---------- */
.hint-btn{
  display:block;margin:6px auto 0;
  background:none;border:0;
  font:inherit;font-size:.95rem;
  color:var(--moon-glow);
  cursor:pointer;
  text-decoration:underline;text-underline-offset:4px;
}
.hint-box{
  max-height:0;opacity:0;overflow:hidden;
  margin-top:0;
  padding:0 16px;
  text-align:center;
  font-style:italic;
  color:#d6dcff;
  border-radius:12px;
  background:rgba(157,180,255,.1);
  border:1px solid transparent;
  transition:max-height .45s ease, opacity .45s ease, margin .45s ease, padding .45s ease, border-color .45s;
}
.hint-box.open{
  max-height:140px;opacity:1;
  margin-top:14px;padding:14px 16px;
  border-color:var(--line);
}

/* ---------- secret content ---------- */
#secretContent{display:none;text-align:center}
#secretContent h2{
  font-family:'Syne',sans-serif;
  font-size:1.5rem;margin:0 0 10px;
  text-shadow:0 0 24px rgba(125,255,207,.6);
}
#secretContent p{margin:0 0 20px;color:#c9d2f7;font-weight:300}
a.enter{
  display:inline-block;
  padding:14px 28px;
  font-weight:600;text-decoration:none;
  color:#06231a;
  background:linear-gradient(135deg,var(--ok),#9dffe9);
  border-radius:14px;
  box-shadow:0 8px 30px rgba(125,255,207,.45);
  transition:transform .15s, box-shadow .25s;
}
a.enter:hover{transform:translateY(-2px);box-shadow:0 12px 44px rgba(125,255,207,.7)}

/* ---------- states ---------- */
.card.shake{animation:shake .45s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-12px)}
  40%{transform:translateX(10px)}
  60%{transform:translateX(-7px)}
  80%{transform:translateX(5px)}
}

.card.unlocked{
  border-color:rgba(125,255,207,.5);
  box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 110px rgba(125,255,207,.3);
}
.card.unlocked .lock{
  box-shadow:0 0 40px rgba(125,255,207,.7);
  border-color:rgba(125,255,207,.6);
}

.hint-btn.fresh{
  color:var(--ember);
  font-weight:600;
  animation:pulse 1.2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{text-shadow:0 0 0 rgba(255,143,216,0)}
  50%{text-shadow:0 0 18px rgba(255,143,216,.95)}
}

.attempts{
  margin:10px 0 0;
  text-align:center;
  font-size:.85rem;
  color:#7f8bbd;
}

/* ---------- game over ---------- */
#lost{display:none;text-align:center}
#lost h2{
  font-family:'Syne',sans-serif;
  font-size:2rem;margin:0 0 10px;
  color:var(--bad);
  text-shadow:0 0 30px rgba(255,107,139,.8);
}
#lost p{margin:0 0 20px;color:#e3c6d0;font-weight:300}
#lost #closing{margin:0;font-weight:600;color:var(--bad)}
#lost button{
  padding:14px 28px;
  font:inherit;font-weight:600;
  color:#2a0612;
  background:linear-gradient(135deg,var(--bad),#ffb199);
  border:0;border-radius:14px;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(255,107,139,.45);
}
#lost button:focus-visible{outline:3px solid var(--moon);outline-offset:3px}

.card.lost{
  border-color:rgba(255,107,139,.55);
  box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 110px rgba(255,107,139,.35);
  animation:rise .6s both, shake .6s;
}
.card.lost .lock{
  border-color:rgba(255,107,139,.6);
  box-shadow:0 0 40px rgba(255,107,139,.7);
}

@media (max-width:520px){
  .moon{width:300px;height:300px;top:-110px;right:-100px}
  h1{font-size:1.65rem}
  .card{padding:32px 22px 26px}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>

<body>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="moon" aria-hidden="true"></div>

<main class="stage">
  <section class="card" id="card">

    <div class="lock" id="lockIcon">🔒</div>

    <div id="gate">
      <h1>Lunar Vault</h1>
      <p class="sub">Say the words to get in.</p>

      <div class="field">
        <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="off">
      </div>

      <button class="unlock" onclick="checkPassword()">Unlock</button>
      <p id="error" role="alert"></p>
      <p class="attempts" id="attempts"></p>

      <button class="hint-btn" id="hintBtn" type="button" onclick="toggleHint()">Need a hint?</button>
      <div class="hint-box" id="hintBox"></div>
    </div>

    <!-- GAME OVER -->
    <div id="lost">
      <h2>YOU LOSE 💀</h2>
      <p id="lostMsg"></p>
      <p id="closing"></p>
    </div>

    <!-- SECRET CONTENT -->
    <div id="secretContent">
      <h2>😎 Welcome to the Lunar Gooner Secret Area</h2>
      <p>You made it past the moon.</p>
      <a class="enter" href="./Lunar/hidden.html">Click here</a>
    </div>

  </section>
</main>

<script>
/* =====================================================
   EDIT ME
   Change the password or the hint right here.
   ===================================================== */
const PASSWORD = "I AM STUPID";
const MAX_ATTEMPTS = 20;   // the page locks you out after this many wrong tries

// Message shown after each wrong attempt (1st fail = first line, 2nd = second, ...)
// The 20th one shows on the "YOU LOSE" screen.
const MESSAGES = [
  "Wrong. Wow.",
  "Wrong again. Shocking.",
  "Seriously? That's your best guess?",
  "Wrong. Did you even think before typing that?",
  "Wrong. Did you type that with your elbows?",
  "Incorrect. Your guessing skills are embarrassing.",
  "Are you even trying, or is this just how you are?",
  "Wrong. A houseplant would've gotten it by now.",
  "That was painful to watch.",
  "Halfway to getting locked out, genius.",
  "Ten wrong guesses. Truly impressive failure.",
  "Wrong. I'm getting secondhand embarrassment.",
  "Wrong. Maybe try using your brain this time.",
  "Have you tried reading the hint? Oh wait, that requires reading.",
  "The hint is RIGHT THERE. Read it, genius.",
  "Wow. Still wrong. Incredible.",
  "Please. Just stop embarrassing yourself.",
  "Only 2 attempts left. Don't blow it. (You will.)",
  "Last chance. The password is literally on screen and you're STILL failing.",
  "You lose. Get out of here."
];

// Hint #1 shows at the start. A new, closer hint appears after every wrong attempt.
// Hint #19 gives away the password.
const HINTS = [
  "It's something you'd say about yourself, not about me.",
  "It's a short sentence. Three words.",
  "All caps, with spaces between the words.",
  "It's not flattering. At all.",
  "The first word is a single letter.",
  "That first letter is how you refer to yourself.",
  "The first word is I.",
  "The second word is a two-letter verb.",
  "The second word starts with A and ends with M.",
  "So far it's: I AM ...",
  "The last word is an insult.",
  "The last word starts with S.",
  "The last word means 'not smart'.",
  "The last word has 6 letters.",
  "The last word looks like S _ U _ _ D.",
  "It starts with I AM, then a word that starts with ST.",
  "I AM STU _ _ _",
  "I AM STUP _ _",
  "Fine, here it is: " + PASSWORD
];
/* ===================================================== */

const input    = document.getElementById("passwordInput");
const errorEl  = document.getElementById("error");
const card     = document.getElementById("card");
const hintBox  = document.getElementById("hintBox");
const hintBtn  = document.getElementById("hintBtn");
const attemptsEl = document.getElementById("attempts");

let failed = 0;
let finished = false;

function showHint(){
  hintBox.textContent = HINTS[Math.min(failed, HINTS.length - 1)];
}
showHint();

function toggleHint(){
  const open = hintBox.classList.toggle("open");
  hintBtn.classList.remove("fresh");
  hintBtn.textContent = open ? "Hide hint" : "Need a hint?";
}

function closeTab(){
  let n = 3;
  const el = document.getElementById("closing");
  el.textContent = "Closing this tab in " + n + "...";
  const t = setInterval(() => {
    n--;
    if(n > 0){
      el.textContent = "Closing this tab in " + n + "...";
    } else {
      clearInterval(t);
      window.close();                       // works if the browser allows it
      setTimeout(() => location.replace("about:blank"), 150);  // fallback: blank the tab
    }
  }, 1000);
}

function checkPassword(){
  if(finished) return;

  if(input.value === PASSWORD){
    finished = true;
    errorEl.textContent = "";
    card.classList.add("unlocked");
    document.getElementById("lockIcon").textContent = "🔓";
    document.getElementById("gate").style.display = "none";
    document.getElementById("secretContent").style.display = "block";
    return;
  }

  failed++;

  if(failed >= MAX_ATTEMPTS){
    finished = true;
    card.classList.remove("shake");
    card.classList.add("lost");
    document.getElementById("lockIcon").textContent = "💀";
    document.getElementById("gate").style.display = "none";
    input.value = "";
    document.getElementById("lostMsg").textContent = MESSAGES[MESSAGES.length - 1];
    document.getElementById("lost").style.display = "block";
    closeTab();
    return;
  }

  errorEl.textContent = MESSAGES[Math.min(failed - 1, MESSAGES.length - 1)];
  attemptsEl.textContent = "Attempt " + failed + " of " + MAX_ATTEMPTS + " used";

  showHint();
  if(!hintBox.classList.contains("open")){
    hintBtn.textContent = "New hint!";
    hintBtn.classList.add("fresh");
  }

  card.classList.remove("shake");
  void card.offsetWidth;          // restart animation
  card.classList.add("shake");
  input.value = "";   // wipe the box so it has to be typed again
  input.focus();
}

input.addEventListener("keydown", e => { if(e.key === "Enter") checkPassword(); });

/* ---------- starfield ---------- */
(function(){
  const c = document.getElementById("stars");
  const ctx = c.getContext("2d");
  let w, h, stars;

  function resize(){
    w = c.width  = window.innerWidth;
    h = c.height = window.innerHeight;
    const count = Math.min(220, Math.floor(w * h / 7000));
    stars = Array.from({length:count}, () => ({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*1.4 + .2,
      p: Math.random()*Math.PI*2,
      s: Math.random()*.02 + .005
    }));
  }

  function draw(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      s.p += s.s;
      const a = .35 + .65*Math.abs(Math.sin(s.p));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = "rgba(220,228,255," + a + ")";
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener("resize", resize);
  resize();
  draw();
})();
</script>

</body>
</html>
