<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17151f;
    --panel: #221f2e;
    --line: #38334a;
    --text: #ece9f5;
    --muted: #9a94b0;
    --accent: #ff5d8f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overscroll-behavior: none; }
  canvas, .bar, .palette { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 14px 40px;
    gap: 16px;
  }
  header { width: 100%; max-width: 820px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; }
  header a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
  header a:hover, header a:focus-visible { color: var(--text); text-decoration: underline; }
  .hint { width: 100%; max-width: 820px; margin: -8px 0 0; color: var(--muted); font-size: 0.95rem; }

  .bar { width: 100%; max-width: 820px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bar .spacer { flex: 1; }
  button.btn {
    font: inherit; font-weight: 500; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; cursor: pointer;
  }
  button.btn:hover:not(:disabled), button.btn:focus-visible { border-color: var(--muted); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0d14; font-weight: 800; }
  button.btn:disabled { opacity: .5; cursor: default; }
  .hidden { display: none !important; }

  .board {
    width: 100%; max-width: 820px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
  }
  .board.editing { border-color: var(--accent); }
  .scroller { border-radius: 4px; display: flex; justify-content: center; }
  canvas {
    display: block;
    image-rendering: pixelated;
    cursor: default;
    touch-action: auto;
    background: #fff;
  }
  .editing canvas { cursor: crosshair; touch-action: none; }

  .tools { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 12px; }
  .palette { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; }
  .swatch {
    aspect-ratio: 1 / 1; border: 2px solid transparent; border-radius: 4px; padding: 0; cursor: pointer;
    outline: 1px solid rgba(255,255,255,.14); outline-offset: -3px;
  }
  .swatch[aria-pressed="true"] { border-color: var(--accent); outline-color: #000; }
  .swatch:focus-visible { border-color: var(--text); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 0.92rem; }
  .row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .status { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #888; flex: none; }
  .dot.ok { background: #4cd98a; }
  .dot.sync { background: #ffc552; }
  .dot.err { background: #ff5d5d; }
  #chg { display: inline-block; min-width: 5ch; font-variant-numeric: tabular-nums; }
  #clearBtn, #cancelBtn { min-width: 5.5em; text-align: center; }
  #pos { font-variant-numeric: tabular-nums; min-width: 9ch; display: inline-block; }
  #cur { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -2px; }
  @media (max-width: 560px) { .palette { grid-template-columns: repeat(8, 1fr); } }

  .admin { width: 100%; max-width: 820px; }
  .admin details { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .admin summary { cursor: pointer; padding: 12px 14px; color: var(--muted); font-weight: 500; list-style: none; }
  .admin summary::-webkit-details-marker { display: none; }
  .admin summary:hover, .admin details[open] summary { color: var(--text); }
  .admin details[open] summary { border-bottom: 1px solid var(--line); }
  .admin .form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px; }
  .admin input[type=password] {
    flex: 1 1 180px; min-width: 0; padding: 8px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: #17151f; color: var(--text); font: inherit;
  }
  .admin input[type=password]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .admin .form label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.9rem; cursor: pointer; }
  #wipeBtn { min-width: 8em; text-align: center; }
  #wipeStatus { font-size: 0.9rem; color: var(--muted); }
  #wipeStatus.ok { color: #4cd98a; }
  #wipeStatus.err { color: #ff5d5d; }
</style>
</head>
<body>

<header>
  <h1>Pixel Wall</h1>
  <a href="/">Back to site</a>
</header>
<p class="hint" id="hint">10,000 squares, shared by everyone. Press Edit to start your own copy, paint what you like, then submit it all at once.</p>

<div class="bar">
  <button class="btn primary" id="editBtn">Edit</button>
  <button class="btn primary hidden" id="submitBtn">Submit</button>
  <button class="btn hidden" id="clearBtn">Clear</button>
  <button class="btn hidden" id="cancelBtn">Cancel</button>
  <span class="spacer"></span>
  <button class="btn hidden" id="saveEditBtn">Save my edit</button>
  <button class="btn" id="saveBoardBtn">Save board</button>
  <button class="btn" id="refreshBtn">Refresh</button>
</div>

<main class="board" id="board">
  <div class="scroller"><canvas id="pwCanvas" width="1000" height="1000" aria-label="Shared 100 by 100 pixel grid"></canvas></div>
</main>

<section class="tools">
  <div class="palette hidden" id="palette" role="group" aria-label="Colour palette"></div>
  <div class="row">
    <span id="chgWrap" class="hidden">Changes <span id="chg">0</span> &nbsp;</span>
    <span id="curWrap" class="hidden">Colour <span id="cur"></span> &nbsp;</span>
    <span>Square <span id="pos">-</span></span>
    <label><input type="checkbox" id="gridlines" checked> Grid lines</label>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">Loading</span></span>
  </div>
</section>

<section class="admin">
  <details id="adminBox">
    <summary>Clear the whole board</summary>
    <div class="form">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" aria-label="Clear password">
      <label><input type="checkbox" id="remember"> Remember for this tab</label>
      <button class="btn" id="wipeBtn">Wipe board</button>
      <span id="wipeStatus" role="status" aria-live="polite"></span>
    </div>
  </details>
</section>

<script>
(function () {
  // ====== CONFIG ======
  const API = "https://slave01.hack3rzboyzo.workers.dev/grid"; // your Worker + /grid
  const N = 100;          // grid is N x N
  let CELL = 10;          // device pixels per cell, recalculated to fit the screen
  const POLL_MS = 8000;   // how often to pull other people's changes
  const TIMEOUT_MS = 10000;

  // 32 colours. Index 0 is white and works as the eraser. Order must match the Worker.
  const PALETTE = [
    "#ffffff","#e4e4e4","#888888","#222222","#ffa7d1","#e50000","#e59500","#a06a42",
    "#e5d900","#94e044","#02be01","#00d3dd","#0083c7","#0000ea","#cf6ee4","#820080",
    "#ffdfcc","#ff8a8a","#ffcf99","#d2b48c","#fff6a0","#c6f5a0","#7fd99a","#a0f0f0",
    "#7fb8ff","#a0a0ff","#e0b0ff","#ff7fbf","#5c3a21","#6b8e23","#1b3a5c","#4b0f2f"
  ];
  const CHARS = "0123456789abcdefghijklmnopqrstuv";
  // ====================

  const $ = id => document.getElementById(id);
  const canvas = $("pwCanvas");
  const ctx = canvas.getContext("2d");

  // Size the canvas so the whole board always fits on screen, with whole-pixel cells (crisp, no scrolling).
  function fitCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const availW = canvas.parentElement.clientWidth || 300;
    const availH = Math.max(280, window.innerHeight - 260);
    const cssSize = Math.min(availW, availH, 820);
    CELL = Math.max(2, Math.floor(cssSize * dpr / N));
    canvas.width = canvas.height = N * CELL;
    canvas.style.width = canvas.style.height = (N * CELL / dpr) + "px";
    drawAll();
  }
  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitCanvas, 150); });

  const server = new Uint8Array(N * N);  // latest known shared state
  const draft = new Map();               // your unsubmitted changes (cell index -> colour), only used in edit mode
  let editing = false;
  let submitting = false;
  let color = 5;
  let showLines = true;

  // ---------- drawing ----------
  function colorAt(i) { return draft.has(i) ? draft.get(i) : server[i]; }

  function drawCell(x, y) {
    const i = y * N + x;
    ctx.fillStyle = PALETTE[colorAt(i)];
    ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    if (showLines && CELL >= 5) {
      ctx.strokeStyle = "rgba(110,110,110,0.55)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x * CELL + 0.5, y * CELL + 0.5, CELL - 1, CELL - 1);
    }
  }
  function drawAll() {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) drawCell(x, y);
  }
  $("gridlines").onchange = e => { showLines = e.target.checked; drawAll(); };

  // ---------- palette ----------
  const palEl = $("palette"), curEl = $("cur");
  PALETTE.forEach((hex, i) => {
    const b = document.createElement("button");
    b.className = "swatch";
    b.style.background = hex;
    b.setAttribute("aria-label", "Colour " + (i + 1));
    b.onclick = () => { color = i; refreshPalette(); };
    palEl.appendChild(b);
  });
  function refreshPalette() {
    [...palEl.children].forEach((b, i) => b.setAttribute("aria-pressed", i === color ? "true" : "false"));
    curEl.style.background = PALETTE[color];
  }
  refreshPalette();

  // ---------- status ----------
  const dot = $("dot"), statusText = $("statusText");
  function setStatus(kind, text) { dot.className = "dot " + kind; statusText.textContent = text; }

  // ---------- edit mode ----------
  const editBtn = $("editBtn"), submitBtn = $("submitBtn"), cancelBtn = $("cancelBtn"), clearBtn = $("clearBtn");

  function updateUi() {
    $("board").classList.toggle("editing", editing);
    editBtn.classList.toggle("hidden", editing);
    submitBtn.classList.toggle("hidden", !editing);
    cancelBtn.classList.toggle("hidden", !editing);
    clearBtn.classList.toggle("hidden", !editing);
    $("saveEditBtn").classList.toggle("hidden", !editing);
    clearBtn.disabled = submitting || draft.size === 0;
    palEl.classList.toggle("hidden", !editing);
    $("curWrap").classList.toggle("hidden", !editing);
    $("chg").textContent = draft.size;
    $("chgWrap").classList.toggle("hidden", !editing);
    submitBtn.disabled = submitting || draft.size === 0;
    cancelBtn.disabled = submitting;
    $("hint").textContent = editing
      ? "You're editing your own copy. Nothing is shared until you press Submit."
      : "10,000 squares, shared by everyone. Press Edit to start your own copy, paint what you like, then submit it all at once.";
  }

  editBtn.onclick = () => { draft.clear(); editing = true; updateUi(); };

  // Two-tap confirm (browser confirm() dialogs are blocked in many in-app previews and webviews)
  function twoTap(btn, armedLabel, action) {
    const original = btn.textContent;
    let timer = null;
    btn.addEventListener("click", () => {
      if (btn.disabled) return;
      if (timer === null && draft.size) {
        btn.textContent = armedLabel;
        timer = setTimeout(() => { timer = null; btn.textContent = original; }, 3000);
        return;
      }
      clearTimeout(timer); timer = null; btn.textContent = original;
      action();
    });
  }

  // Clear: wipe your draft back to the shared board but stay in edit mode for a redo
  twoTap(clearBtn, "Sure?", () => {
    draft.clear(); updateUi(); drawAll();
  });

  // Cancel: discard the draft and leave edit mode
  twoTap(cancelBtn, "Sure?", () => {
    draft.clear(); editing = false; updateUi(); drawAll();
  });

  submitBtn.onclick = async () => {
    if (!draft.size || submitting) return;
    submitting = true; updateUi(); setStatus("sync", "Submitting");
    try {
      const cells = [...draft].map(([i, c]) => [i % N, Math.floor(i / N), c]);
      const data = await api({
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cells })
      });
      if (data.grid) applyServer(data.grid);
      draft.clear(); editing = false;
      setStatus("ok", "Submitted");
    } catch (err) {
      setStatus("err", "Submit failed (" + err.message + "). Your changes are still here, try again.");
    } finally {
      submitting = false; updateUi(); drawAll();
    }
  };

  window.addEventListener("beforeunload", e => {
    if (editing && draft.size) { e.preventDefault(); e.returnValue = ""; }
  });

  // ---------- painting (edit mode only) ----------
  function paint(x, y) {
    if (!editing || submitting || x < 0 || y < 0 || x >= N || y >= N) return;
    const i = y * N + x;
    if (colorAt(i) === color) return;
    if (color === server[i]) draft.delete(i); else draft.set(i, color);
    drawCell(x, y);
    updateUi();
  }
  function cellAt(e) {
    const r = canvas.getBoundingClientRect();
    return [Math.floor((e.clientX - r.left) / r.width * N), Math.floor((e.clientY - r.top) / r.height * N)];
  }
  function line(x0, y0, x1, y1) {   // Bresenham, so fast drags leave no gaps
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      paint(x0, y0);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  let drawing = false, last = null;
  canvas.addEventListener("pointerdown", e => {
    if (!editing) return;
    drawing = true; canvas.setPointerCapture(e.pointerId);
    last = cellAt(e); paint(last[0], last[1]);
  });
  canvas.addEventListener("pointermove", e => {
    const [x, y] = cellAt(e);
    $("pos").textContent = (x >= 0 && y >= 0 && x < N && y < N) ? x + ", " + y : "-";
    if (!drawing) return;
    line(last[0], last[1], x, y); last = [x, y];
  });
  const endStroke = () => { drawing = false; last = null; };
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);

  // ---------- save image to device ----------
  function stamp() {
    const d = new Date(), z = n => String(n).padStart(2, "0");
    return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + "-" + z(d.getHours()) + z(d.getMinutes());
  }
  // useDraft = true saves your private edit, false saves the shared board
  function saveImage(useDraft) {
    const SCALE = 10, out = document.createElement("canvas");
    out.width = out.height = N * SCALE;
    const g = out.getContext("2d");
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x;
      g.fillStyle = PALETTE[useDraft ? colorAt(i) : server[i]];
      g.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
    }
    const name = (useDraft ? "pixelwall-my-edit-" : "pixelwall-board-") + stamp() + ".png";
    out.toBlob(async blob => {
      if (!blob) { setStatus("err", "Couldn't make the image"); return; }
      const file = new File([blob], name, { type: "image/png" });
      // On phones the share sheet offers "Save Image" / save to Photos
      if (window.matchMedia("(pointer: coarse)").matches && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "Pixel Wall" }); setStatus("ok", "Image ready"); return; }
        catch (err) { if (err.name === "AbortError") return; /* otherwise fall through to download */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      setStatus("ok", "Image saved");
    }, "image/png");
  }
  $("saveBoardBtn").onclick = () => saveImage(false);
  $("saveEditBtn").onclick = () => saveImage(true);

  // ---------- network ----------
  async function api(opts) {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(API, Object.assign({ cache: "no-store", signal: ac.signal }, opts || {}));
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (err) {
      if (err.name === "AbortError") throw new Error("timed out");
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  // same as api() but for a sub-path, and it hands back the error body instead of throwing
  async function apiPath(path, opts) {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(API + path, Object.assign({ cache: "no-store", signal: ac.signal }, opts || {}));
      let data = {};
      try { data = await res.json(); } catch {}
      return { ok: res.ok, status: res.status, data };
    } catch (err) {
      if (err.name === "AbortError") throw new Error("timed out");
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  function applyServer(str) {
    if (typeof str !== "string" || str.length !== N * N) return;
    for (let i = 0; i < N * N; i++) {
      const v = CHARS.indexOf(str[i]);
      if (v >= 0) server[i] = v;
    }
    // drop draft cells that now match the shared grid
    for (const [i, c] of [...draft]) if (server[i] === c) draft.delete(i);
  }

  async function load(manual) {
    if (submitting) return;
    if (manual) setStatus("sync", "Loading");
    try {
      const data = await api();
      applyServer(data.grid);
      drawAll();
      updateUi();
      setStatus("ok", "Live");
    } catch (err) {
      setStatus("err", "Can't reach server (" + err.message + ")");
    }
  }
  $("refreshBtn").onclick = () => load(true);

  setInterval(() => { if (!document.hidden && !drawing) load(false); }, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });

  // ---------- admin: wipe the whole board ----------
  const wipeBtn = $("wipeBtn"), pwEl = $("pw"), rememberEl = $("remember"), wipeStatusEl = $("wipeStatus");
  let keyCache = null; // { id, key } — derived key, reused while the password is unchanged

  function setWipe(kind, text) { wipeStatusEl.className = kind; wipeStatusEl.textContent = text; }

  try {
    const saved = sessionStorage.getItem("pw");
    if (saved) { pwEl.value = saved; rememberEl.checked = true; }
  } catch {}

  const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");

  // PBKDF2 the password into an HMAC key, then sign the server's nonce with it.
  // The password itself never goes over the wire.
  async function proofFor(password, salt, iterations, nonce) {
    const id = iterations + "|" + salt + "|" + password;
    if (!keyCache || keyCache.id !== id) {
      const base = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]
      );
      const bits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", salt: new TextEncoder().encode(salt), iterations, hash: "SHA-256" },
        base, 256
      );
      const key = await crypto.subtle.importKey("raw", bits, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
      keyCache = { id, key };
    }
    return toHex(await crypto.subtle.sign("HMAC", keyCache.key, new TextEncoder().encode(nonce)));
  }

  // always-arm confirm, unlike twoTap which only arms when there is a draft
  function armConfirm(btn, label, action) {
    const original = btn.textContent;
    let timer = null;
    btn.addEventListener("click", () => {
      if (btn.disabled) return;
      if (timer === null) {
        btn.textContent = label;
        timer = setTimeout(() => { timer = null; btn.textContent = original; }, 3000);
        return;
      }
      clearTimeout(timer); timer = null; btn.textContent = original;
      action();
    });
  }

  armConfirm(wipeBtn, "Wipe everything?", async () => {
    if (submitting) return;
    const pw = pwEl.value;
    if (!pw) { setWipe("err", "Enter the password"); pwEl.focus(); return; }

    submitting = true; updateUi(); wipeBtn.disabled = true;
    try {
      setWipe("", "Requesting challenge…");
      const cr = await apiPath("/challenge");
      if (!cr.ok) throw new Error(cr.data.error || "no challenge issued");
      const ch = cr.data;

      setWipe("", "Deriving key…");
      const proof = await proofFor(pw, ch.salt, ch.iterations, ch.nonce);

      setWipe("", "Wiping…");
      const res = await apiPath("/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nonce: ch.nonce, proof })
      });
      if (!res.ok) throw new Error(res.data.error || "rejected");

      applyServer(res.data.grid);
      draft.clear();
      editing = false;

      try {
        if (rememberEl.checked) sessionStorage.setItem("pw", pw);
        else sessionStorage.removeItem("pw");
      } catch {}

      setWipe("ok", "Board wiped");
      setStatus("ok", "Board wiped");
    } catch (err) {
      setWipe("err", String(err.message || err));
    } finally {
      submitting = false; wipeBtn.disabled = false; updateUi(); drawAll();
    }
  });

  updateUi();
  fitCanvas();
  load(true);
})();
</script>
</body>
</html>
